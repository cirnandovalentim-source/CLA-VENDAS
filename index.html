
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FF7A00" />
    <title>CLA VENDAS</title>
    
    <!-- SHIMS: Fix libraries expecting Node.js environment -->
    <script>
      window.global = window;
      window.process = {
        env: { NODE_ENV: 'production' }
      };
      
      // ERROR TRAP: Captura erros de importação ou execução antes do React
      window.onerror = function(msg, url, line, col, error) {
        const loader = document.getElementById('initial-loader');
        const errorContainer = document.getElementById('error-container');
        const errorText = document.getElementById('error-text');
        
        console.error("Global Error:", msg, error);

        if (loader) loader.style.display = 'none';
        if (errorContainer && errorText) {
            errorContainer.style.display = 'flex';
            errorText.innerText = msg + "\n\n" + (error ? error.stack : '');
        }
        return false;
      };
      
      // Captura erros de Promise (ex: falha ao carregar importação)
      window.onunhandledrejection = function(event) {
         window.onerror(event.reason ? event.reason.message : 'Erro desconhecido (Promise)', '', 0, 0, event.reason);
      };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                orange: '#FF7A00',
                dark: '#1E1E1E',
                darker: '#121212',
                gray: '#404040',
                light: '#E5E5E5'
              }
            },
            fontFamily: {
              sans: ['Inter', 'Roboto', 'sans-serif'],
              handwriting: ['Caveat', 'cursive'],
            },
            keyframes: {
              'fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              'slide-up': {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              'slide-down': {
                '0%': { transform: 'translate(-50%, -100%)', opacity: '0' },
                '100%': { transform: 'translate(-50%, 0)', opacity: '1' },
              }
            },
            animation: {
              'fade-in': 'fade-in 0.3s ease-out',
              'slide-up': 'slide-up 0.4s ease-out',
              'slide-down': 'slide-down 0.3s ease-out'
            }
          }
        }
      }
    </script>
    <style>
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #F3F4F6;
      }
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      
      /* Loading Spinner Styles */
      #initial-loader {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #F3F4F6;
        color: #FF7A00;
        font-family: sans-serif;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e5e5e5;
        border-top: 4px solid #FF7A00;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Error Screen */
      #error-container {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: #FEF2F2;
        color: #991B1B;
        z-index: 10000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        text-align: center;
      }

      body {
        font-family: 'Inter', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #FF7A00; }
      html.dark body { background-color: #121212; }
      html.dark ::-webkit-scrollbar-thumb { background: #333; }
      
      @media print {
        body * { visibility: hidden; }
        #receipt-content, #receipt-content * { visibility: visible; }
        #receipt-content { 
            position: absolute; 
            left: 0; 
            top: 0; 
            width: 100%; 
            margin: 0; 
            padding: 0; 
            background-color: white !important; 
            color: black !important; 
            border: none !important;
        }
        /* Ensure inputs look like text */
        input { border: none; background: transparent; }
      }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- IMPORT MAP: FIXED with 'bundle' to prevent load errors -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/": "https://esm.sh/react@18.2.0/",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/": "https://esm.sh/react-dom@18.2.0/",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?bundle&deps=react@18.2.0,react-dom@18.2.0",
        "recharts": "https://esm.sh/recharts@2.12.3?bundle&deps=react@18.2.0,react-dom@18.2.0,prop-types@15.8.1",
        "lucide-react": "https://esm.sh/lucide-react@0.358.0?bundle&deps=react@18.2.0",
        "uuid": "https://esm.sh/uuid@9.0.1?bundle",
        "date-fns": "https://esm.sh/date-fns@3.6.0?bundle",
        "date-fns/": "https://esm.sh/date-fns@3.6.0/",
        "date-fns/locale": "https://esm.sh/date-fns@3.6.0/locale?bundle",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.0?bundle",
        "prop-types": "https://esm.sh/prop-types@15.8.1"
      }
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <p>Iniciando CLA VENDAS...</p>
      </div>
    </div>

    <!-- Error Fallback Display -->
    <div id="error-container">
        <h2 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem;">Ocorreu um erro ao carregar</h2>
        <pre id="error-text" style="background: rgba(255,255,255,0.5); padding: 10px; border-radius: 8px; max-width: 100%; overflow: auto; text-align: left; margin-bottom: 20px;"></pre>
        <button onclick="window.location.reload()" style="background: #991B1B; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
            Tentar Novamente
        </button>
    </div>

    <!-- ENTRY POINT SCRIPT -->
    <script type="module" src="/index.tsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
